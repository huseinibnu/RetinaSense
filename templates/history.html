{% extends "base.html" %}
{% block title %}History{% endblock %}

{% block content %}
<header class="mb-6">
  <h1 class="text-[28px] font-bold tracking-tight">History</h1>
  <p class="text-[14px] text-ink-600 mt-1">Riwayat analisis tersimpan di browser ini (localStorage).</p>
</header>

<div class="relative max-w-md mb-5">
  <i data-lucide="search" class="w-4 h-4 text-ink-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
  <input id="searchInput" type="text" placeholder="Cari analisis..."
         class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-line bg-surface text-[14px] focus:outline-none focus:border-primary-600" />
</div>

<div id="historyList" class="space-y-3"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/state.js') }}"></script>
<script>
(function () {
  const listEl = document.getElementById('historyList');
  function render(q = '') {
    const items = RS.loadHistory().filter(h =>
      (h.modalityLabel + h.modelName).toLowerCase().includes(q.toLowerCase()));
    if (!items.length) { listEl.innerHTML = '<p class="text-ink-500 text-[14px]">Belum ada riwayat.</p>'; return; }
    listEl.innerHTML = items.map(h => {
      const dt = new Date(h.ts);
      const icon = h.modality === 'cfp' ? 'eye' : 'layers';
      return `<div class="rounded-card border border-line bg-surface p-4 flex items-center gap-4">
        <div class="w-10 h-10 rounded-lg bg-primary-50 text-primary-600 flex items-center justify-center shrink-0"><i data-lucide="${icon}" class="w-5 h-5"></i></div>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-[15px]">${h.modalityLabel}</div>
          <div class="text-[12px] text-ink-500">${dt.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})} · ${dt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</div>
          <div class="text-[12px] text-ink-600 mt-0.5">${h.count} citra · ${h.modelName} · ${h.tta} TTA</div>
        </div>
        <span class="text-[12px] px-2 py-1 rounded bg-okbg text-ok font-medium">${h.status}</span>
        <button data-del="${h.id}" class="p-2 rounded-lg hover:bg-dangerbg text-ink-500 hover:text-danger"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>`;
    }).join('');
    listEl.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', () => { RS.deleteHistory(b.dataset.del); render(document.getElementById('searchInput').value); }));
    lucide.createIcons();
  }
  document.getElementById('searchInput').addEventListener('input', e => render(e.target.value));
  render();
})();
</script>
{% endblock %}
